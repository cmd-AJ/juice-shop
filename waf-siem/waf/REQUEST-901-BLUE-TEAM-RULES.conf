# Reglas personalizadas - Hito 3 Blue Team

# Regla 10020 - Detectar patron XSS en el parametro q
SecRule ARGS:q "@contains <script" \
    "id:10020,phase:2,pass,log,auditlog,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'H3 Blue Team - XSS detection',\
    tag:'hito3/xss'"

# Regla 10021 - Detectar patron SQLi de prueba en q
SecRule ARGS:q "@contains or '1'='1" \
    "id:10021,phase:2,pass,log,auditlog,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'H3 Blue Team - SQLi detection',\
    tag:'hito3/sqli'"

# Regla 10022 - Detectar User-Agent de Nikto
SecRule REQUEST_HEADERS:User-Agent "@contains nikto" \
    "id:10022,phase:1,pass,log,auditlog,\
    t:none,t:lowercase,\
    msg:'H3 Blue Team - Scanner detection',\
    tag:'hito3/scanner'"
